[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-guard-runner"
version = "1.0.0"
description = "Evidence-based GitHub Actions test runner for CI Guard"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.scripts]
ci-guard = "ci_guard_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ci_guard_runner*"]
