name: CI Guard Flagsmith experiment
on:
  push:
    branches: [feat/ci-guard-flagsmith-experiment]
    paths:
      - '.github/workflows/flagsmith-experiment.yml'
      - 'infra/*experiment*'
      - 'scripts/*experiment*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    name: Real Flagsmith Observe vs Enforce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run against a disposable self-hosted Flagsmith instance
        run: bash scripts/run_flagsmith_experiment.sh evidence/flagsmith-experiment-results.json
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagsmith-experiment-results
          path: evidence/flagsmith-experiment-results.json
          if-no-files-found: ignore
